[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dipoletools"
version = "0.1.0"
description = "A Python toolkit for measuring and analysing cosmic dipoles in source-count and temperature maps using Bayesian nested sampling."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mali"},
]
keywords = ["cosmology", "dipole", "healpix", "nested-sampling", "bayesian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "healpy>=1.16",
    "astropy>=5.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "ultranest>=3.0",
    "h5py>=3.0",
    "getdist>=1.4",
    "anesthetic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
examples = [
    "dynesty>=2.0",
    "corner>=2.2",
]

[project.urls]
Homepage = "https://github.com/mali/dipoletools"
Repository = "https://github.com/mali/dipoletools"
Issues = "https://github.com/mali/dipoletools/issues"

[tool.setuptools.packages.find]
include = ["dipoletools*"]
